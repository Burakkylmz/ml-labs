[project]
name = "ml-labs"
version = "0.1.0"
description = "Docker-based, reproducible Python lab environment for Machine Learning training"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "jupyterlab>=4.1",
]

[tool.uv]
package = false

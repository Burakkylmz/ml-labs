# General project configuration for ml-labs.
# Do not add API keys, passwords, or tokens here; use environment variables instead.

project_name: ml-labs
random_seed: 42
dataset_dir: data
lab_dir: labs
log_level: INFO

data:
  ecommerce_shipping: data/ecommerce_shipping/Train.csv
  northwind:
    customers: data/northwind/customers.csv
    orders: data/northwind/orders.csv
    shippers: data/northwind/shippers.csv
  king_county_house_sales: data/king_county_house_sales/kc_house_data.csv
  dataco_supply_chain: data/dataco_supply_chain/DataCoSupplyChainDataset.csv

lab05:
  target: Freight
  random_seed: 42

lab06:
  target: Reached.on.Time_Y.N
  positive_class: 1
  random_seed: 42

lab05_capstone:
  target: price
  random_seed: 42

lab07:
  target: Reached.on.Time_Y.N
  positive_class: 1
  random_seed: 42
  decision_threshold: 0.5

  benchmark:
    ranking_metric: roc_auc
    training_repeats: 3
    inference_repeats: 10
    warmup_runs: 2
    threads: 2

  models:
    logistic_regression:
      max_iter: 1000

    decision_tree:
      max_depth: 5

    bagging:
      base_max_depth: 3
      n_estimators: 20

    random_forest:
      n_estimators: 100
      max_depth: 8
      min_samples_leaf: 2
      max_features: sqrt

    adaboost:
      n_estimators: 50
      learning_rate: 0.5

    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3

    xgboost:
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0

    lightgbm:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      num_leaves: 31
      min_child_samples: 20

lab08:
  target: Late_delivery_risk
  positive_class: 1
  random_seed: 42

  split:
    strategy: chronological_group_aware
    group_column: Order Id
    date_column: order date (DateOrders)
    train_ratio: 0.70
    validation_ratio: 0.15
    test_ratio: 0.15

  feature_selection:
    variance_threshold: 0.0
    select_k_best: 20

  model:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.1
    tree_method: hist
    device: cpu
    eval_metric: logloss

  benchmark:
    threads: 2
    training_repeats: 3
    inference_repeats: 10
    warmup_runs: 2
    decision_threshold: 0.5
    ranking_metric: roc_auc

  explainability:
    permutation_sample_size: 3000
    permutation_repeats: 5
    shap_background_size: 100
    shap_sample_size: 500
    shap_local_examples: 3

lab09:
  target: Late_delivery_risk
  positive_class: 1
  random_seed: 42

  cross_validation:
    strategy: group_aware_temporal
    n_splits: 3
    group_column: Order Id
    date_column: order date (DateOrders)

  optimization:
    primary_metric: roc_auc

    grid_search:
      max_depth: [3, 5]
      learning_rate: [0.05, 0.1]
      n_estimators: [50, 100]

    randomized_search:
      n_iter: 8
      max_depth: [3, 4, 5, 6, 8]
      learning_rate: [0.01, 0.03, 0.05, 0.1, 0.2]
      n_estimators: [50, 100, 150, 200]
      subsample: [0.7, 0.8, 0.9, 1.0]
      colsample_bytree: [0.7, 0.8, 1.0]
      reg_lambda: [0.1, 1.0, 5.0, 10.0]

  resources:
    search_jobs: 1
    estimator_threads: 2

  evaluation:
    decision_threshold: 0.5
    run_final_test: false

  experiment_tracking:
    enabled: true
    artifact_directory: labs/lab09/artifacts
    save_cv_results: true
    save_environment_metadata: true
    save_dataset_hash: true

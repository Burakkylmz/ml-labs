[project]
name = "ml-labs"
version = "0.1.0"
description = "Docker-based, reproducible Python lab environment for Machine Learning training"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "jupyterlab>=4.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "shap>=0.51.0",
    "ipywidgets>=8.1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

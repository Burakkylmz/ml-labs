# General project configuration for ml-labs.
# Do not add API keys, passwords, or tokens here; use environment variables instead.

project_name: ml-labs
random_seed: 42
dataset_dir: data
lab_dir: labs
log_level: INFO

data:
  ecommerce_shipping: data/ecommerce_shipping/Train.csv
  northwind:
    customers: data/northwind/customers.csv
    orders: data/northwind/orders.csv
    shippers: data/northwind/shippers.csv
  king_county_house_sales: data/king_county_house_sales/kc_house_data.csv
  dataco_supply_chain: data/dataco_supply_chain/DataCoSupplyChainDataset.csv
  bike_sharing_daily: data/bike_sharing/day.csv
  bike_sharing_hourly: data/bike_sharing/hour.csv

lab05:
  target: Freight
  random_seed: 42

lab06:
  target: Reached.on.Time_Y.N
  positive_class: 1
  random_seed: 42

lab05_capstone:
  target: price
  random_seed: 42

lab07:
  target: Reached.on.Time_Y.N
  positive_class: 1
  random_seed: 42
  decision_threshold: 0.5

  benchmark:
    ranking_metric: roc_auc
    training_repeats: 3
    inference_repeats: 10
    warmup_runs: 2
    threads: 2

  models:
    logistic_regression:
      max_iter: 1000

    decision_tree:
      max_depth: 5

    bagging:
      base_max_depth: 3
      n_estimators: 20

    random_forest:
      n_estimators: 100
      max_depth: 8
      min_samples_leaf: 2
      max_features: sqrt

    adaboost:
      n_estimators: 50
      learning_rate: 0.5

    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3

    xgboost:
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0

    lightgbm:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      num_leaves: 31
      min_child_samples: 20

lab08:
  target: Late_delivery_risk
  positive_class: 1
  random_seed: 42

  split:
    strategy: chronological_group_aware
    group_column: Order Id
    date_column: order date (DateOrders)
    train_ratio: 0.70
    validation_ratio: 0.15
    test_ratio: 0.15

  feature_selection:
    variance_threshold: 0.0
    select_k_best: 20

  model:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.1
    tree_method: hist
    device: cpu
    eval_metric: logloss

  benchmark:
    threads: 2
    training_repeats: 3
    inference_repeats: 10
    warmup_runs: 2
    decision_threshold: 0.5
    ranking_metric: roc_auc

  explainability:
    permutation_sample_size: 3000
    permutation_repeats: 5
    shap_background_size: 100
    shap_sample_size: 500
    shap_local_examples: 3

lab09:
  target: Late_delivery_risk
  positive_class: 1
  random_seed: 42

  cross_validation:
    strategy: group_aware_temporal
    n_splits: 3
    group_column: Order Id
    date_column: order date (DateOrders)

  optimization:
    primary_metric: roc_auc

    grid_search:
      max_depth: [3, 5]
      learning_rate: [0.05, 0.1]
      n_estimators: [50, 100]

    randomized_search:
      n_iter: 8
      max_depth: [3, 4, 5, 6, 8]
      learning_rate: [0.01, 0.03, 0.05, 0.1, 0.2]
      n_estimators: [50, 100, 150, 200]
      subsample: [0.7, 0.8, 0.9, 1.0]
      colsample_bytree: [0.7, 0.8, 1.0]
      reg_lambda: [0.1, 1.0, 5.0, 10.0]

  resources:
    search_jobs: 1
    estimator_threads: 2

  evaluation:
    decision_threshold: 0.5
    run_final_test: false

  experiment_tracking:
    enabled: true
    artifact_directory: labs/lab09/artifacts
    save_cv_results: true
    save_environment_metadata: true
    save_dataset_hash: true

lab10:
  target:
    column: cnt
    date_column: dteday
    frequency: D

  forecasting:
    horizon: 14
    seasonal_period: 7
    moving_average_window: 7

  split:
    training_start: "2011-01-01"
    training_end: "2012-08-31"
    validation_start: "2012-09-01"
    validation_end: "2012-10-31"
    test_start: "2012-11-01"
    test_end: "2012-12-31"

  backtesting:
    strategy: expanding_window
    horizon: 14
    step_size: 14
    number_of_origins: 4

  evaluation:
    metrics: [mae, rmse, wape, mase]
    mase_scaling: fixed_initial_training
    protect_test_set: true

  artifacts:
    directory: labs/lab10/artifacts

lab11:
  dataset_path: data/bike_sharing/day.csv

  target:
    column: cnt
    date_column: dteday
    frequency: D

  forecasting:
    horizon: 14
    seasonal_period: 7
    strategy: recursive

  features:
    lags: [1, 7, 14, 28]
    rolling_mean: [7, 14]
    rolling_std: [7]
    rolling_min: [7]
    rolling_max: [7]
    calendar:
      day_of_week: true
      month: true
      quarter: true
      is_weekend: true
      cyclical_encoding: true

  models:
    ridge:
      alpha: 10.0
    random_forest:
      n_estimators: 100
      max_depth: 8
      min_samples_leaf: 3
    xgboost:
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9
      tree_method: hist
    lightgbm:
      n_estimators: 100
      learning_rate: 0.05
      max_depth: 4
      num_leaves: 15
      min_child_samples: 20

  benchmark:
    threads: 2
    ranking_metric: pooled_mae
    measure_training_time: true
    measure_inference_time: true

  evaluation:
    metrics: [mae, rmse, wape, mase, forecast_bias]
    mase_scaling: fixed_initial_training
    protect_test_set: true

  artifacts:
    directory: labs/lab11/artifacts

lab12:
  dataset:
    directory: data/freight_cost
    filename_pattern: "SCMS_Delivery_History_Dataset*"
    target_column: Freight Cost (USD)
    weight_column: Weight (Kilograms)
    encoding: latin-1

  qualification:
    enable_target_audit: true
    enable_granularity_audit: true
    enable_selection_bias_analysis: true
    enable_temporal_feasibility_analysis: true

  artifacts:
    directory: labs/lab12/artifacts

  stage03_5:
    enabled: true

    grouping:
      primary_key: "ASN/DN #"

    reference_resolution:
      validate_anchor_id: true
      validate_shipment_key: true
      allow_unresolved_references: false

    qualification:
      evaluate_row_coverage: true
      evaluate_shipment_coverage: true
      evaluate_selection_bias: true
      evaluate_aggregation_semantics: true
      evaluate_prediction_time_availability: true

    figures:
      enabled: true
      directory: "labs/lab12/artifacts/figures/stage03_5"

  stage04:
    enabled: true

    eda:
      temporal_field: "Scheduled Delivery Date"
      cutoff_date: "2013-12-31"
      enforce_target_isolation: true
      protect_future_target: true

    statistics:
      quantiles: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99]
      correlation_methods: [pearson, spearman]
      bootstrap:
        enabled: true
        n_resamples: 1000
        random_seed: 42

    visualization:
      enabled: true
      save_figures: true
      directory: "labs/lab12/artifacts/figures/stage04"

    artifacts:
      directory: "labs/lab12/artifacts"

  stage05:
    enabled: true

    split:
      temporal_field: "Scheduled Delivery Date"
      train_end: "2013-12-31"
      validation_start: "2014-01-01"
      validation_end: "2014-12-31"
      test_start: "2015-01-01"
      test_end_policy: "last_observed_date"
      preserve_stage04_eda_cutoff: true
      assign_before_target_filtering: true
      protect_test_target: true

    grouping:
      primary_key: "ASN/DN #"
      enforce_group_isolation: true
      verify_cost_anchor_dependencies: true

    cross_validation:
      strategy: "expanding_window"
      candidate_validation_years: [2010, 2011, 2012, 2013]
      calendar_aware: true
      enforce_group_isolation: true

    temporal_gap:
      policy: "conditional"
      require_label_availability_review: true

    evaluation:
      development_only_cv: true
      external_validation_year: 2014
      protected_test_year: 2015
      defer_test_evaluation: true

    reproducibility:
      dataset_sha256_required: true
      freeze_split_manifest: true
      freeze_cv_fold_manifest: true
      create_protocol_fingerprint: true

    artifacts:
      directory: "labs/lab12/artifacts"
      figures_directory: "labs/lab12/artifacts/figures/stage05"

  stage06:
    enabled: true

    evaluation:
      reuse_stage05_protocol: true
      verify_protocol_fingerprint: true
      development_only: true
      primary_metric: pooled_mae

    probe_models:
      ridge:
        alpha: 10.0
      random_forest:
        n_estimators: 80
        max_depth: 8
        min_samples_leaf: 3
        n_jobs: 2

    experiments:
      missing_values:
        enabled: true
        candidates: [median, median_with_indicator]
      encoding:
        enabled: true
        candidates: [one_hot, ordinal, rare_category_one_hot]
      scaling:
        enabled: true
        candidates: [none, standard, robust, minmax]
      outliers:
        enabled: true
        candidates: [keep, feature_iqr_capping]
      target_transformation:
        enabled: true
        candidates: [original, log, log1p]

    feature_policy:
      exclude_unknown_availability: true
      weight_sensitivity_only: true
      exclude_target_derived_features: true

    reproducibility:
      random_seed: 42
      store_fold_results: true
      store_config_hashes: true

    artifacts:
      directory: "labs/lab12/artifacts"
      figures_directory: "labs/lab12/artifacts/figures/stage06"

  stage07:
    enabled: true

    evaluation:
      reuse_stage05_protocol: true
      verify_protocol_fingerprint: true
      development_only: true
      primary_metric: pooled_mae

    feature_engineering:
      shipment_composition: true
      shipment_value: conditional
      product_diversity: true
      transport_contract_extensions: true
      calendar_features: conditional
      weight_features: sensitivity_only

    feature_selection:
      enabled: true
      methods: [no_selection, filter, embedded, limited_wrapper]
      filter:
        k_candidates: [5, 10, 15]
      embedded:
        selector: lasso
      wrapper:
        n_features_to_select: 8
        step: 2

    ablation:
      enabled: true
      strategies: [add_one_group, drop_one_group]

    importance:
      permutation_enabled: true
      n_repeats: 5

    probe_models:
      reuse_stage06_estimators: true
      allow_hyperparameter_tuning: false

    reproducibility:
      random_seed: 42
      store_experiment_registry: true
      store_fold_results: true

    artifacts:
      directory: "labs/lab12/artifacts"
      figures_directory: "labs/lab12/artifacts/figures/stage07"

  stage08:
    enabled: true

    evaluation:
      reuse_stage05_protocol: true
      verify_protocol_fingerprint: true
      development_only: true
      primary_metric: pooled_mae

    baselines:
      global_median:
        enabled: true
      global_mean:
        enabled: true
      shipment_mode_median:
        enabled: true
        feature: "Shipment Mode"
      incoterm_median:
        enabled: true
        feature: "Vendor INCO Term"
      hierarchical_segment_median:
        enabled: true
        features: ["Shipment Mode", "Vendor INCO Term"]
        min_support: 10
        fallback: global_median

    metrics:
      mae: true
      rmse: true
      median_ae: true
      wape: true
      bias: true
      high_cost_mae: true

    reproducibility:
      random_seed: 42
      store_fold_results: true
      store_oof_predictions: true
      store_baseline_registry: true

    artifacts:
      directory: "labs/lab12/artifacts"
      figures_directory: "labs/lab12/artifacts/figures/stage08"

  stage09:
    enabled: true

    evaluation:
      reuse_stage05_protocol: true
      verify_protocol_fingerprint: true
      development_only: true
      primary_metric: pooled_mae
      business_baseline: B4
      statistical_baseline: B1

    feature_sets:
      primary: minimal_core
      secondary: extended_eligible
      conditional_features_enabled: false

    models:
      ridge:
        enabled: true
        alpha: 10.0
      elastic_net:
        enabled: true
        alpha: 1.0
        l1_ratio: 0.5
        max_iter: 10000
      random_forest:
        enabled: true
        n_estimators: 80
        max_depth: 8
        min_samples_leaf: 3
        n_jobs: 2
      extra_trees:
        enabled: true
        n_estimators: 100
        max_depth: 8
        min_samples_leaf: 3
        n_jobs: 2
      xgboost:
        enabled: true
        n_estimators: 200
        max_depth: 5
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        reg_lambda: 1.0
        tree_method: hist
        n_jobs: 2
      lightgbm:
        enabled: true
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 20
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.8
        reg_lambda: 1.0
        n_jobs: 2

    benchmarking:
      early_stopping_enabled: false
      hyperparameter_tuning_enabled: false
      measure_fit_time: true
      measure_prediction_time: true

    secondary_experiment:
      enabled: true
      max_model_count: 3

    shortlisting:
      target_count: 3
      allow_inconclusive: true

    reproducibility:
      random_seed: 42
      store_oof_predictions: true
      store_fold_metrics: true
      store_experiment_registry: true

    artifacts:
      directory: "labs/lab12/artifacts"
      figures_directory: "labs/lab12/artifacts/figures/stage09"

  stage10:
    enabled: true

    evaluation:
      reuse_stage05_protocol: true
      verify_protocol_fingerprint: true
      development_only: true
      primary_metric: pooled_oof_mae

    models: [M04, M05]

    feature_set:
      name: minimal_core
      reuse_stage07_contract: true
      include_conditional_features: false

    preprocessing:
      reuse_stage06_and_stage09: true
      allow_reoptimization: false

    search:
      strategy: bounded_parameter_sampling
      random_seed: 42
      include_stage09_reference: true
      trials_per_model: 16
      frozen_cv_folds: 4
      max_primary_fits: 128
      early_stopping_enabled: false

    extra_trees:
      search_space:
        n_estimators: [80, 120, 200, 300]
        max_depth: [6, 8, 12, null]
        min_samples_leaf: [2, 3, 5, 10]
        min_samples_split: [2, 5, 10]
        max_features: [0.6, 0.8, 1.0]
      fixed:
        bootstrap: false
        random_state: 42
        n_jobs: 2

    xgboost:
      search_space:
        n_estimators: [120, 200, 320, 450]
        max_depth: [3, 4, 5, 7]
        learning_rate: [0.025, 0.05, 0.075, 0.1]
        min_child_weight: [1, 3, 6]
        subsample: [0.75, 0.85, 1.0]
        colsample_bytree: [0.75, 0.85, 1.0]
        reg_lambda: [0.5, 1.0, 5.0, 10.0]
        reg_alpha: [0.0, 0.1, 1.0]
        gamma: [0.0, 0.1, 1.0]
      fixed:
        objective: "reg:squarederror"
        tree_method: hist
        random_state: 42
        n_jobs: 2

    metrics:
      pooled_mae: true
      rmse: true
      high_cost_mae: true
      underprediction_rate: true
      bias: true
      fit_time: true

    model_selection:
      provisional_only: true
      preserve_family_alternative: true
      max_candidates_for_stage11: 2

    reproducibility:
      verify_reference_scores: true
      store_trial_manifest: true
      store_config_hashes: true
      store_fold_metrics: true

    artifacts:
      directory: "labs/lab12/artifacts"
      figures_directory: "labs/lab12/artifacts/figures/stage10"
